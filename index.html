<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecotech - Ajude o Meio Ambiente</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html">
        <img src="assets/logo-ecotech.png" alt="Logo do site" width="150px" />
      </a>
    </header>

    <main class="main-container">

      <section class="text-content">
        <p>
          EcoTech - Um site educativo que responde dúvidas sobre meio ambiente
          com inteligência artificial para conscientizar todos os usuários.
        </p>
      </section>

      <section id="chat-messages" class="respostas" aria-live="polite"></section>

    <form id="chat-form" class="perguntas" aria-label="Formulário de perguntas">
      <input
        id="user-input"
        type="text"
        placeholder="Digite sua dúvida..."
        autocomplete="off"
        required
      />
      <button type="submit">Enviar</button>
    </form>

      <aside class="globe-container">
        <iframe
          src=https://vasturiano.github.io/three-globe/example/custom-material/
          loading="lazy"
          allowfullscreen
          scrolling="no"
        ></iframe>
      </aside>

      
      <script src="ai.js"></script>
    </main>
  </body>
</html>
