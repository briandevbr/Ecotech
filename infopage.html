<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EcoTech</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&family=Montserrat:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="infopage.css" />
    </head>
    <body>
        <div class="splash">
            <img src="img/logo.png" alt="EcoTech" />
        </div>

        <header class="header reveal">
            <a href="infopage.html" class="header__brand">EcoTech</a>

            <nav class="header__nav">
                <svg
                    class="header__icon"
                    width="14"
                    height="10"
                    viewBox="0 0 14 10"
                    aria-hidden="true"
                >
                    <rect x="0" y="4" width="2" height="6" />
                    <rect x="4" y="0" width="2" height="10" />
                    <rect x="8" y="3" width="2" height="7" />
                    <rect x="12" y="5" width="2" height="5" />
                </svg>
                <a href="index.html" class="header__link">Home</a>
                <button type="button" class="header__link">Menu</button>
            </nav>
        </header>

        <main class="hero">
            <div class="gallery">
                <figure class="gallery__item gallery__item--side reveal">
                    <img src="img/img1.jpg" alt="Girafa na natureza" />
                </figure>
                <figure class="gallery__item gallery__item--main reveal">
                    <img src="img/img2.jpg" alt="Floresta com luz natural" />
                </figure>
                <figure class="gallery__item gallery__item--side reveal">
                    <img src="img/img3.jpg" alt="Tundra com nevoa" />
                </figure>
            </div>

            <div class="hero__text reveal reveal--up">
                <p class="hero__eyebrow">Apenas um lar</p>
                <h1 class="hero__title">Natureza</h1>
                <p class="hero__description">
                    A natureza é a nossa casa, e precisamos cuidar dela. A preservação do meio
                    ambiente é essencial para garantir a sobrevivência de todas as espécies,
                    incluindo a nossa.
                </p>
            </div>
        </main>

        <script src="js/infopage.js"></script>
    </body>
</html>
